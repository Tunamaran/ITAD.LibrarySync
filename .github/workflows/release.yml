name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Tests
        run: dotnet test --configuration Release

      - name: Publish App
        run: |
          dotnet publish src/ITAD.LibrarySync.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          Compress-Archive -Path publish/* -DestinationPath ITAD.LibrarySync-win-x64.zip

      - name: Build Inno Setup Installer
        run: |
          choco install innosetup -y
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer/setup.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITAD.LibrarySync-Artifacts
          path: |
            ITAD.LibrarySync-win-x64.zip
            Output/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ITAD.LibrarySync-win-x64.zip
            Output/*.exe
          draft: false
          overwrite: true
          generate_release_notes: true
